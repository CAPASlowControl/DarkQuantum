command {
    InTerminator = LF "$";
    OutTerminator = LF;
    extraInput = Ignore;
    out '\$1'; 
    in '%*/\n/%{active|inactive|failed}'
}

commandSSH {
    InTerminator = LF "$";
    OutTerminator = LF;
    ReadTimeout = 1000; # Time after last byte. Increased for http/ssh connections.
    extraInput = Ignore;
    out '\$1'; 
    in '%*/\n/%{active|inactive|failed}'
}


